<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRIS // Edgerunners</title>
  <script>
    // aplica el tema antes de pintar para evitar parpadeo
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    })();
    // aplica la skin de bloques antes de pintar para evitar parpadeo
    (function () {
      var s = null;
      try { s = localStorage.getItem('skin'); } catch (e) {}
      if (['retro', 'neon', 'pastel', 'pixel'].indexOf(s) === -1) s = 'retro';
      document.documentElement.dataset.skin = s;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-controls">
      <select id="skin-select" aria-label="Estilo de bloques">
        <option value="retro">Retro</option>
        <option value="neon">Neón</option>
        <option value="pastel">Pastel</option>
        <option value="pixel">Pixel art</option>
      </select>
      <button id="theme-toggle" type="button" aria-pressed="false">Modo claro</button>
    </div>
    <header class="title-block">
      <h1 class="title" data-text="TETRIS">TETRIS</h1>
      <p class="subtitle">// NIGHT CITY EDITION</p>
    </header>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
