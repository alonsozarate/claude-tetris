<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRIS // Edgerunners</title>
  <script>
    // aplica el tema antes de pintar para evitar parpadeo
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" type="button" aria-pressed="false">Modo claro</button>
    <header class="title-block">
      <h1 class="title" data-text="TETRIS">TETRIS</h1>
      <p class="subtitle">// NIGHT CITY EDITION</p>
    </header>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="name-entry" class="name-entry hidden">
            <label for="player-name" class="label">NOMBRE</label>
            <div class="name-row">
              <input id="player-name" type="text" maxlength="12" value="AAA" autocomplete="off" spellcheck="false" />
              <button id="save-btn" type="button">Guardar</button>
            </div>
          </div>
          <section id="records" class="records hidden" aria-label="Records">
            <p class="label records-title">TOP 5</p>
            <table class="records-table">
              <thead>
                <tr><th>#</th><th>NOMBRE</th><th>PUNTOS</th><th>LÍN</th><th>NIV</th></tr>
              </thead>
              <tbody id="records-body"></tbody>
            </table>
            <p class="records-stats">Mejor combo: <span id="best-combo">0</span> · Líneas máx: <span id="max-lines">0</span></p>
            <button id="clear-records-btn" type="button">Borrar records</button>
          </section>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
